<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy — JohnLewaga</title>
  <style>
    :root {
      --brand: #2563eb;
      --brand-dark: #1e40af;
      --text: #1f2937;
      --muted: #6b7280;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: #fff;
      padding: 64px 24px 80px;
      text-align: center;
    }

    header .logo {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      opacity: 0.9;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 2.4rem;
      margin-bottom: 12px;
    }

    header p {
      opacity: 0.9;
      font-size: 1rem;
    }

    /* Content card */
    .container {
      max-width: 820px;
      margin: -48px auto 64px;
      padding: 0 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      padding: 48px;
    }

    .updated {
      display: inline-block;
      background: #eff6ff;
      color: var(--brand-dark);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 32px;
    }

    h2 {
      font-size: 1.4rem;
      margin: 36px 0 12px;
      color: var(--text);
    }

    h2:first-of-type { margin-top: 0; }

    p { margin-bottom: 16px; color: #374151; }

    ul {
      margin: 0 0 16px 22px;
      color: #374151;
    }

    ul li { margin-bottom: 8px; }

    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .contact-box {
      margin-top: 40px;
      padding: 24px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 32px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      header { padding: 48px 20px 72px; }
      header h1 { font-size: 1.8rem; }
      .card { padding: 28px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">JohnLewaga</div>
    <h1>Privacy Policy</h1>
    <p>Your privacy matters to us. Here's how we handle your data.</p>
  </header>

  <main class="container">
    <div class="card">
      <span class="updated">Last updated: July 25, 2026</span>

      <!-- PLACEHOLDER CONTENT — replace with your real policy -->
      <h2>1. Introduction</h2>
      <p>
        This is placeholder text. Welcome to JohnLewaga ("we", "us", or "our").
        This Privacy Policy explains how we collect, use, and protect your
        information when you use our website and services.
      </p>

      <h2>2. Information We Collect</h2>
      <p>We may collect the following types of information:</p>
      <ul>
        <li>Personal details such as your name and email address.</li>
        <li>Usage data, including pages visited and time spent on our site.</li>
        <li>Cookies and similar tracking technologies.</li>
      </ul>

      <h2>3. How We Use Your Information</h2>
      <p>We use the information we collect to:</p>
      <ul>
        <li>Provide, operate, and maintain our services.</li>
        <li>Improve and personalize your experience.</li>
        <li>Communicate with you about updates and offers.</li>
      </ul>

      <h2>4. Sharing Your Information</h2>
      <p>
        This is placeholder text. We do not sell your personal information.
        We may share data with trusted third-party providers only as needed
        to operate our services and comply with the law.
      </p>

      <h2>5. Your Rights</h2>
      <p>
        Depending on your location, you may have the right to access, correct,
        or delete your personal information. Contact us to exercise these rights.
      </p>

      <h2>6. Data Security</h2>
      <p>
        This is placeholder text. We implement reasonable technical and
        organizational measures to protect your data against unauthorized
        access, loss, or misuse.
      </p>

      <h2>7. Changes to This Policy</h2>
      <p>
        We may update this Privacy Policy from time to time. Any changes will
        be posted on this page with an updated revision date.
      </p>
      <!-- END PLACEHOLDER CONTENT -->

      <div class="contact-box">
        <h2 style="margin-top:0;">Contact Us</h2>
        <p style="margin-bottom:0;">
          If you have any questions about this Privacy Policy, please contact us at
          <a href="mailto:privacy@johnlewaga.com">privacy@johnlewaga.com</a>.
        </p>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2026 JohnLewaga. All rights reserved.
  </footer>

</body>
</html>
